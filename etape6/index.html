<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widtd=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="form_container">
        <div class="form_group">
            <label class="form_label">Nom:</label>
            <input type="text" id="form_nom" class="form_field">
        </div>
        <div class="form_group">
            <label class="form_label">Prenom:</label>
            <input type="text" id="form_prenom" class="form_field">
        </div>
        <div class="form_group">
            <label class="form_label">Points:</label>
            <input type="text" id="form_points" class="form_field">
        </div>
        <button id="ajouter">Ajouter</button>
    </div>
    <div id="table_container">
        <table>
            <tr>
                <th>N</th>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
        </table>
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Totale point(s) = 0</p>
        </div>
        <button id="console">Console Tableau</button>
        <button id="supprimer">Supprimer</button>
    </div>
    
</body>
</html>
